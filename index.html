const JOBS = [{"id":"D1_TURTLE","day":1,"title":"消えたカメを探して！","description":"おばあちゃんの大事なカメが行方不明。後日のお礼もあるかも？","pay":5000,"intro":[["おばあちゃん","うちの亀吉が、昨日から帰ってこないのよ"],["美桜","カメの亀吉ですね。最後に見た場所は？"],["おばあちゃん","庭の池のあたり。あの子、石の陰が好きでねえ"],["美桜","なるほど。まずは確認する場所を決めよう"]],"choices":[{"text":"町内に捜索の貼り紙を出す","success":false},{"text":"池の石の陰を見てみる","success":true}],"resultSuccess":[["美桜","いた！ 亀吉、気持ちよさそうに休んでる"],["おばあちゃん","まあ！ こんな近くに！"],["美桜","近所中を探す前でよかったですね(笑)"],["おばあちゃん","ありがとう。今度またお願いしたいことがあるの"]],"resultFail":[["美桜","捜索の貼り紙、できました！"],["おばあちゃん","あら、亀吉なら今、池から顔を出してるわ"],["美桜","……貼り紙の印刷代が、ちょっと切ない"],["おばあちゃん","でも探してくれてありがとうね"]],"failPay":3000},{"id":"D1_PARCEL","day":1,"title":"大至急！ 謎の荷物を届けて！","description":"『さくら屋』へ急ぎの配達。同名の店が二軒あるらしい","pay":9000,"intro":[["依頼人","この荷物を、さくら屋さんに届けて！"],["美桜","さくら屋ですね。住所はどちらですか？"],["依頼人","それが、商店街の方としか……"],["美桜","同じ名前のお店が二軒あるんですけど！"]],"choices":[{"text":"伝票の電話番号で宛先を確認する","success":true},{"text":"近くのさくら屋に運んでみる","success":false}],"resultSuccess":[["美桜","確認完了。駅前じゃなくて、一本裏の通りでした！"],["依頼人","危なかった。助かりました！"],["美桜","配達の秘密兵器は、電話確認ですね(笑)"]],"resultFail":[["さくら屋店主","うち、これ注文してないですよ？"],["美桜","ですよね……同名のもう一軒でした！"],["依頼人","二度手間をかけてしまってごめんね"],["美桜","次は住所込みでお願いします(笑)"]],"failPay":7000},{"id":"D1_MACHINE","day":1,"title":"この機械、直せますか？","description":"お店の挨拶マシンが突然無言に。原因は意外に身近？","pay":12000,"intro":[["店主","うちの『いらっしゃいませ機』がしゃべらなくなってさ"],["美桜","いらっしゃいませ機……？"],["店主","入口で声を出してくれるんだ。昨日、掃除したあとから無音で"],["美桜","掃除のあと、か。設定も見てみよう"]],"choices":[{"text":"電源ボタンを何度も押してみる","success":false},{"text":"音量と設定を確認する","success":true}],"resultSuccess":[["美桜","音量がゼロになってました。これでどうです？"],["機械","いらっしゃいませー！"],["店主","戻った！ ありがとう！"],["美桜","原因が分かれば案外シンプルですね"]],"resultFail":[["機械","いらっしゃいませぇぇぇ！！！"],["店主","わっ！ 急に元気すぎる！"],["美桜","連打はしないで設定を先に見るべきでしたね……"],["店主","直ったから、まあよし！(笑)"]],"failPay":10000},{"id":"D2_PROMO","day":2,"title":"商店街の宣伝を手伝って！","description":"小さなパン屋の宣伝コピー作り。評判が良ければ追加報酬も","pay":8000,"intro":[["パン屋店主","新装開店するんだけど、宣伝の一言が決まらなくて"],["美桜","お店のいちばんの自慢は？"],["店主","毎朝焼く小さな塩パン。売り切れることもあるけど、手作りは続けたいんだ"],["美桜","じゃあ、その良さをちゃんと伝えよう"]],"choices":[{"text":"全国一おいしい！ 絶対に売り切れないパン！","success":false},{"text":"毎朝焼きたて。小さな店の、ほかほか塩パン","success":true}],"resultSuccess":[["店主","これならうちのことがちゃんと伝わる！"],["美桜","大げさな宣伝より、お店らしさがいちばんですよ"],["店主","開店後の反応も報告するね！"]],"resultFail":[["店主","……うち、全国一かどうかは測れないし、売り切れるんだけど"],["美桜","はい、誇張しすぎました。印刷前でよかった！"],["店主","作り直し分だけ報酬を調整させてね"]],"failPay":6000},{"id":"D2_TASTE","day":2,"title":"新商品の試食モニター募集！","description":"栗とチーズの新作スイーツを試食。率直な意見が求められている","pay":7000,"intro":[["菓子店主","栗とチーズのタルトを作ったの。試食してくれる？"],["美桜","栗にチーズ！ それは気になる組み合わせだなあ"],["菓子店主","甘さをどうするか、まだ迷ってて"],["美桜","なるほど。ちゃんと感想を伝えよう"]],"choices":[{"text":"栗の香りがいいので、甘さを少し控えるともっと好きです","success":true},{"text":"とにかく最高です！ 直すところはありません！","success":false}],"resultSuccess":[["菓子店主","ありがとう！ それ、試してみたかった方向なの！"],["美桜","栗の味が引き立つと嬉しいです(笑)"],["菓子店主","改善版ができたら、また連絡するね"]],"resultFail":[["菓子店主","ありがとう。でも、具体的にどこが良かった？"],["美桜","……おいしさに夢中で、メモを忘れました"],["菓子店主","今回は簡易モニターの報酬にするね"]],"failPay":5000},{"id":"D2_LOST","day":2,"title":"落とし物の持ち主を探して！","description":"革の手帳の持ち主を、メモの中身から絞り込もう","pay":10000,"intro":[["案内所の人","この革の手帳、落とし主が分からなくて"],["美桜","中に何か手がかりは？"],["案内所の人","『朝6時、粉をこねる』『新作の塩パン』『焼き上がりの確認』って書いてあるわ"],["美桜","なるほど。心当たりがあるのは……"]],"choices":[{"text":"花屋さんの店主","success":false},{"text":"パン屋さんの店主","success":true}],"resultSuccess":[["パン屋店主","うわっ、探してた手帳だ！ 明日の準備が全部書いてあるんだ"],["美桜","返せてよかった。手がかりがずいぶんおいしそうでした(笑)"],["案内所の人","持ち主が見つかったね、ありがとう！"]],"resultFail":[["花屋店主","うーん、塩パンは好きだけど、粉はこねないかな"],["美桜","ですよね……パンのことばかり書いてあるし！"],["案内所の人","もう一人に届けておくね。調査ありがとう"]],"failPay":8000},{"id":"D3_BAKERY","day":3,"title":"開店直前！ パン屋の助っ人","description":"開店前の準備が大混乱。まず何を片づける？","pay":11000,"intro":[["パン屋店主","大変！ オープンまであと少しなのに、パンが店頭に並んでない！"],["美桜","焼き上がってはいるんですね？"],["パン屋店主","うん。店内の飾りつけもまだだけど……"],["美桜","まず優先するのは……"]],"choices":[{"text":"飾りつけを完璧に仕上げる","success":false},{"text":"まずパンを並べて値札を確認する","success":true}],"resultSuccess":[["パン屋店主","間に合った！ 最初のお客さんが来たよ！"],["美桜","パン屋さんは、パンを買える状態が第一ですから(笑)"]],"resultFail":[["パン屋店主","飾りはきれい！ でもパンがまだ出てない！"],["美桜","見た目より先に売り場を整えるべきだった！"],["パン屋店主","一緒に急いで並べよう！"]],"failPay":9000},{"id":"D3_MC","day":3,"title":"町内イベントの司会をお願い！","description":"急な司会の代役。大事なのは盛り上げ方より確認？","pay":13000,"intro":[["実行委員","司会の人が急に来られなくなって！ 代役をお願いできる？"],["美桜","私でよければ。進行表はありますか？"],["実行委員","あるけど、出演者の順番が昨日変更になってね"],["美桜","じゃあ、まず……"]],"choices":[{"text":"最新の進行表と名前の読み方を確認する","success":true},{"text":"勢いで登壇して盛り上げる","success":false}],"resultSuccess":[["美桜","続いては、ダンスサークルの皆さんです！"],["実行委員","完璧！ 安心して任せられたよ"],["美桜","本番前の確認が効きましたね"]],"resultFail":[["美桜","次は手品ショー……えっ、ダンス！？"],["観客","どっち！？(笑)"],["実行委員","途中から立て直せたけど、ちょっと焦ったね"],["美桜","進行表、先に見ればよかったぁ！"]],"failPay":11000},{"id":"D3_FESTIVAL","day":3,"title":"商店街フェスの緊急助っ人！","description":"人気の屋台に行列発生。落ち着いた判断が頼り","pay":15000,"intro":[["実行委員","人気の屋台に人が集まりすぎて、列がぐちゃぐちゃなんだ！"],["美桜","在庫は？ 何人くらい並べます？"],["実行委員","残り30個だけど、整理券はまだ出してない！"],["美桜","それなら、まず……"]],"choices":[{"text":"さらに大声でお客さんを呼び込む","success":false},{"text":"在庫を確認し、30枚の整理券で列を整える","success":true}],"resultSuccess":[["実行委員","列が落ち着いた！ みんな安心して買えてる！"],["美桜","数が分かれば、案内もできますからね"]],"resultFail":[["実行委員","呼び込んだら、さらに大行列になったー！"],["美桜","これは先に在庫と列を整理しないと！"],["実行委員","立て直しを手伝ってくれてありがとう！"]],"failPay":13000}];
const BONUSES = [{"id":"D1_TURTLE","amount":4000,"lines":[["おばあちゃん","亀吉のお散歩見守りの相談にも乗ってくれて助かったわ。追加のお礼よ"],["美桜","亀吉、今度は池から出てくるかな(笑)"]]},{"id":"D2_PROMO","amount":2000,"lines":[["パン屋店主","宣伝を見て来てくれた人が増えたの！ 成果分の追加報酬ね"],["美桜","それは嬉しいな！"]]},{"id":"D2_TASTE","amount":2000,"lines":[["菓子店主","意見をもとに改良したタルトが好評だったの。追加のモニター謝礼よ"],["美桜","栗の香り、大事にして正解だったね"]]}];
const GOAL = 50000;
const SAVE_KEY = 'mio-oddjobs-v1';
const PHASES = ['list','intro','choice','result','reward','dayend','bonus','ending'];
const clone = value => JSON.parse(JSON.stringify(value));
const yen = value => value.toLocaleString('ja-JP') + '円';
const freshState = () => ({day:1,money:0,jobsDoneToday:0,chosenJobs:[],outcomeByJob:{},day1Snapshot:null,day3BonusesApplied:false,phase:'list',activeJob:null,cursor:0,pendingSuccess:null});
const jobById = id => JOBS.find(j => j.id === id);
function introFor(s) {
  const job = jobById(s.activeJob), result = clone(job.intro);
  if(job.id==='D3_BAKERY' && s.outcomeByJob.D2_PROMO===true) result.push(['パン屋店主','昨日の宣伝コピー、早速「見たよ」って人が来てるの！']);
  return result;
}
function resultFor(s) {
  const job = jobById(s.activeJob), result = clone(s.pendingSuccess ? job.resultSuccess : job.resultFail);
  if(job.id==='D3_FESTIVAL' && s.outcomeByJob.D1_TURTLE===true) result.push(['おばあちゃん','亀吉も応援してるわよ！'],['美桜','亀吉、今日も落ち着いてるなあ(笑)']);
  return result;
}
const earnedBonuses = s => BONUSES.filter(b=>s.outcomeByJob[b.id]===true);
function transition(previous, action, value) {
  const s = clone(previous);
  if(action==='accept') {
    const job = jobById(value);
    if(s.phase!=='list'||s.jobsDoneToday>=2||!job||job.day!==s.day||s.chosenJobs.includes(value)) return previous;
    s.activeJob=value;s.phase='intro';s.cursor=0;
  } else if(action==='next') {
    if(s.phase==='intro') {
      if(s.cursor+1<introFor(s).length) s.cursor++; else {s.phase='choice';s.cursor=0;}
    } else if(s.phase==='result') {
      if(s.cursor+1<resultFor(s).length) s.cursor++;
      else {
        const job=jobById(s.activeJob);
        s.money+=s.pendingSuccess?job.pay:job.failPay;
        s.outcomeByJob[job.id]=s.pendingSuccess;s.chosenJobs.push(job.id);s.jobsDoneToday++;s.phase='reward';s.cursor=0;
      }
    } else return previous;
  } else if(action==='choose') {
    if(s.phase!=='choice'||![0,1].includes(value)) return previous;
    s.pendingSuccess=jobById(s.activeJob).choices[value].success;s.phase='result';s.cursor=0;
  } else if(action==='finish') {
    if(s.phase!=='reward') return previous;
    s.activeJob=null;s.pendingSuccess=null;s.phase=s.jobsDoneToday===2?'dayend':'list';
    if(s.day===1&&s.jobsDoneToday===2) s.day1Snapshot=clone({money:s.money,outcomeByJob:s.outcomeByJob,chosenJobs:s.chosenJobs});
  } else if(action==='newday') {
    if(s.phase!=='dayend') return previous;
    if(s.day===3) s.phase='ending';
    else {
      s.day++;s.jobsDoneToday=0;s.phase='list';
      if(s.day===3&&!s.day3BonusesApplied) {
        const bonuses=earnedBonuses(s);
        s.money+=bonuses.reduce((sum,b)=>sum+b.amount,0);s.day3BonusesApplied=true;
        if(bonuses.length) s.phase='bonus';
      }
    }
  } else if(action==='bonusdone') {
    if(s.phase!=='bonus') return previous;
    s.phase='list';
  } else if(action==='retry') {
    if(s.phase!=='ending'||s.money>=GOAL||!s.day1Snapshot) return previous;
    return {...freshState(),...clone(s.day1Snapshot),day:2,day1Snapshot:clone(s.day1Snapshot)};
  } else return previous;
  return s;
}
function validSave(s) {
  if(!s||!PHASES.includes(s.phase)||![1,2,3].includes(s.day)||!Array.isArray(s.chosenJobs)||!s.outcomeByJob||typeof s.outcomeByJob!=='object'||new Set(s.chosenJobs).size!==s.chosenJobs.length) return false;
  if(s.chosenJobs.some(id=>!jobById(id)||jobById(id).day>s.day||typeof s.outcomeByJob[id]!=='boolean')) return false;
  if(Object.keys(s.outcomeByJob).length!==s.chosenJobs.length||Object.keys(s.outcomeByJob).some(id=>!s.chosenJobs.includes(id))) return false;
  for(let day=1;day<=3;day++) {
    const count=s.chosenJobs.filter(id=>jobById(id).day===day).length;
    if(count>2||(day<s.day&&count!==2)||(day===s.day&&count!==s.jobsDoneToday)) return false;
  }
  if(typeof s.day3BonusesApplied!=='boolean'||s.day3BonusesApplied!==(s.day===3)) return false;
  const money=s.chosenJobs.reduce((sum,id)=>sum+(s.outcomeByJob[id]?jobById(id).pay:jobById(id).failPay),0)+(s.day3BonusesApplied?earnedBonuses(s).reduce((sum,b)=>sum+b.amount,0):0);
  if(s.money!==money) return false;
  if(s.day>1||(s.day===1&&s.jobsDoneToday===2&&s.phase!=='reward')) {
    const ids=s.chosenJobs.filter(id=>jobById(id).day===1), snap=s.day1Snapshot;
    if(!snap||JSON.stringify(snap.chosenJobs)!==JSON.stringify(ids)||Object.keys(snap.outcomeByJob||{}).length!==2||ids.some(id=>snap.outcomeByJob[id]!==s.outcomeByJob[id])||snap.money!==ids.reduce((sum,id)=>sum+(s.outcomeByJob[id]?jobById(id).pay:jobById(id).failPay),0)) return false;
  }
  if(['intro','choice','result','reward'].includes(s.phase)) {
    const job=jobById(s.activeJob);
    if(!job||job.day!==s.day||s.chosenJobs.includes(job.id)!==(s.phase==='reward')) return false;
    if(['result','reward'].includes(s.phase)&&typeof s.pendingSuccess!=='boolean') return false;
    if(s.phase!=='reward'&&s.jobsDoneToday>=2) return false;
    if(['intro','result'].includes(s.phase)&&(!Number.isInteger(s.cursor)||s.cursor<0||s.cursor>=(s.phase==='intro'?introFor(s):resultFor(s)).length)) return false;
  }
  if(['dayend','ending'].includes(s.phase)&&s.jobsDoneToday!==2) return false;
  if(s.phase==='ending'&&s.day!==3) return false;
  if(s.phase==='bonus'&&(s.day!==3||s.jobsDoneToday!==0||!earnedBonuses(s).length)) return false;
  if(s.phase==='list'&&s.jobsDoneToday>=2) return false;
  return true;
}
const escapeHTML = text => String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (id,cls='') => `<svg class="${cls}" viewBox="0 0 32 32" aria-hidden="true"><use href="#${id}"/></svg>`;
const art = cls => `<svg class="${cls}" viewBox="0 0 460 370" role="img" aria-label="小さな町にある、美桜のなんでも屋"><use href="#town"/></svg>`;
const btn = (action,label,primary=true,value) => `<button class="${primary?'primary':'secondary'}" data-action="${action}"${value===undefined?'':` data-value="${value}"`}>${label}</button>`;
const icons=['search','box','tool','note','cake','search','bread','mic','flag'];
let state=freshState(),started=false,saveAvailable=true,resumeCandidate=null;
const app=document.getElementById('app');
const modal=document.getElementById('reset-dialog');
try {const raw=localStorage.getItem(SAVE_KEY);if(raw){const saved=JSON.parse(raw);if(saved.version===1&&validSave(saved.state)) resumeCandidate=saved.state;}} catch {saveAvailable=false;}
function save() {
  try {localStorage.setItem(SAVE_KEY,JSON.stringify({version:1,state}));saveAvailable=true;}catch{saveAvailable=false;}
}
function dashboard() {
  const remaining=Math.max(0,GOAL-state.money);
  return `<section class="dashboard" aria-label="現在の進行状況"><div class="day-mark"><strong>${state.day}</strong><span>DAY<br>/ 3 DAYS</span></div><div><div class="money-top"><span class="money-label">いまの旅行資金</span><span class="money">${state.money.toLocaleString('ja-JP')}<span class="yen">円</span></span></div><div class="progress" role="progressbar" aria-label="旅行資金の達成度" aria-valuemin="0" aria-valuemax="50000" aria-valuenow="${Math.min(GOAL,state.money)}" aria-valuetext="${yen(state.money)} / 50,000円"><span style="width:${Math.min(100,state.money/GOAL*100)}%"></span></div><div class="goal-caption"><span>${remaining?'目標まで '+yen(remaining):'目標額に到達！'}</span><span>目標 50,000円</span></div></div><div class="daily-count"><div class="dots" aria-label="今日完了した依頼 ${state.jobsDoneToday}件">${'●'.repeat(state.jobsDoneToday)+'○'.repeat(2-state.jobsDoneToday)}</div><p>今日の残り受注 ${2-state.jobsDoneToday}件</p></div></section>`;
}
function titleView() {
  return `<section class="hero"><div><div class="eyebrow">A LITTLE WORK, A LITTLE ADVENTURE.</div><h1 class="focus-title" tabindex="-1">美桜の<span class="big">3</span>日間<br>なんでも屋！</h1><p class="lead">旅行まであと3日。<br>資金0円から50,000円を目指す！<br>小さな仕事を、旅の切符に。</p><div class="actions">${resumeCandidate?btn('continue','つづきから <span aria-hidden="true">→</span>')+btn('start-over','最初から',false):btn('start','はじめる <span aria-hidden="true">→</span>')}</div><p class="micro">1周 約5〜10分 · 選択肢を押して進むゲーム<br>${resumeCandidate?'前回の進行状況が保存されています。':'ゆっくり読んで、自分のペースでどうぞ。'}</p></div><div class="art-wrap">${art('hero-art')}<div class="stamp">期間限定<br>3日間営業</div><div class="art-caption"><span>THE LITTLE SHOP IN OUR TOWN</span><span>OPEN / 01—03</span></div></div></section><section class="how" aria-label="遊び方"><div class="how-item"><span class="how-num">01</span><div><strong>今日の仕事を選ぶ</strong><p>1日3件の候補から、2件をお手伝い。</p></div></div><div class="how-item"><span class="how-num">02</span><div><strong>話を聞いて、ひとつ選ぶ</strong><p>依頼人との会話に耳を傾けよう。</p></div></div><div class="how-item"><span class="how-num">03</span><div><strong>3日間で、旅じたく</strong><p>お仕事を重ねて、旅行資金を集めよう。</p></div></div></section>`;
}
function listView() {
  const available=JOBS.filter(j=>j.day===state.day&&!state.chosenJobs.includes(j.id));
  return `<section><div class="section-head"><div><div class="eyebrow">TODAY'S REQUESTS</div><h2 class="focus-title" tabindex="-1">${state.jobsDoneToday?'次は、どのお手伝い？':'今日も、なんでも屋日和。'}</h2></div><p>気になる依頼をひとつ選ぼう。<br>今日受けられるのは、あと${2-state.jobsDoneToday}件。</p></div><div class="cards">${available.map(j=>`<article class="job-card"><div class="job-top">${icon(icons[JOBS.indexOf(j)],'job-icon')}<span class="job-code">REQUEST / 0${JOBS.indexOf(j)+1}</span></div><h3>${escapeHTML(j.title)}</h3><p class="job-description">${escapeHTML(j.description)}</p>${BONUSES.some(b=>b.id===j.id)?'<span class="tag">後日のお礼・追加報酬の可能性</span>':''}<div class="pay"><small>報酬目安</small>${j.pay.toLocaleString('ja-JP')}<span class="yen">円</span></div>${btn('accept','この依頼を受ける <span aria-hidden="true">→</span>',true,j.id)}</article>`).join('')}</div><p class="note">報酬はお手伝いの結果によって変わります。<br>うまくいかない日も、できた分のお礼は受け取れます。</p></section>`;
}
function speech(line) {return `<div class="speaker"><span class="avatar" aria-hidden="true">${escapeHTML(line[0].slice(0,1))}</span>${escapeHTML(line[0])}</div><p class="speech">${escapeHTML(line[1])}</p>`;}
function storyView() {
  const job=jobById(state.activeJob),phase=state.phase;
  let content='',counter='';
  if(phase==='intro'||phase==='result') {
    const dialogue=phase==='intro'?introFor(state):resultFor(state);
    counter=`${state.cursor+1} / ${dialogue.length}`;
    content=`<div class="dialogue">${speech(dialogue[state.cursor])}</div><div class="story-actions">${btn('next',state.cursor+1<dialogue.length?'つぎへ <span aria-hidden="true">→</span>':phase==='intro'?'どうしよう？ <span aria-hidden="true">→</span>':'お礼を受け取る <span aria-hidden="true">→</span>')}</div>`;
  } else if(phase==='choice') {
    content=`<div class="dialogue">${speech(introFor(state).at(-1))}</div><p class="choice-label">美桜なら、どうする？</p><div class="choices">${job.choices.map((c,i)=>`<button class="choice" data-action="choose" data-value="${i}"><span aria-hidden="true">${i?'B':'A'}</span>${escapeHTML(c.text)}</button>`).join('')}</div>`;
  } else {
    content=`<div class="dialogue">${speech(['美桜','お手伝い、終了！ お礼を受け取りました。'])}<div class="receipt"><span>今回の獲得報酬</span><strong>+${yen(state.pendingSuccess?job.pay:job.failPay)}</strong></div></div><div class="story-actions">${btn('finish',state.jobsDoneToday===2?'今日の営業を終える <span aria-hidden="true">→</span>':'依頼一覧へ <span aria-hidden="true">→</span>')}</div>`;
  }
  return `<section class="story-layout"><aside class="side-note">${art('mini-art')}<div class="eyebrow">DAY ${state.day} / REQUEST ${phase==='reward'?state.jobsDoneToday:state.jobsDoneToday+1}</div><h3>一件ずつ、<br>旅の切符に。</h3><p>話を聞くことも、<br>なんでも屋の大事なお仕事。</p></aside><div class="story-paper"><div class="story-top"><h2 class="focus-title" tabindex="-1">${escapeHTML(job.title)}</h2><span class="counter">${counter|| (phase==='choice'?'選択': 'お仕事完了')}</span></div>${content}</div></section>`;
}
function dayendView() {
  const comments=['今日はここまで。初日の営業、おつかれさま！','今日もいろんなお手伝いをしました。旅行まで、あと1日！','3日間のなんでも屋、営業終了。さあ、旅じたくの結果は……？'];
  return `<section class="center-paper"><div class="eyebrow">CLOSED FOR TODAY</div><div class="day-total">Day ${state.day}</div><h2 class="focus-title" tabindex="-1">今日の営業、おしまい。</h2><p>${comments[state.day-1]}</p><div class="receipt"><span>ここまでの旅行資金</span><strong>${yen(state.money)}</strong></div><div class="actions">${btn('newday',state.day===3?'3日間の結果を見る →':`${state.day+1}日目の朝へ →`)}</div></section>`;
}
function bonusView() {
  return `<section class="center-paper"><div class="eyebrow">LETTERS OF THANKS</div><h2 class="focus-title" tabindex="-1">追加のお礼が届いた！</h2><p>3日目の朝、うれしい便りが届きました。</p><div class="bonus-list">${earnedBonuses(state).map(b=>`<article class="bonus-item"><strong>追加のお礼 +${yen(b.amount)}</strong>${b.lines.map(l=>`<p><b>${escapeHTML(l[0])}</b>「${escapeHTML(l[1])}」</p>`).join('')}</article>`).join('')}</div><div class="actions">${btn('bonusdone','今日の依頼を見る →')}</div></section>`;
}
function endingView() {
  if(state.money<GOAL) return `<section class="center-paper"><div class="eyebrow">ONE MORE TRY</div><h2 class="focus-title" tabindex="-1">旅じたくは、あと少し。</h2><div class="receipt"><span>目標まで</span><strong>あと${yen(GOAL-state.money)}</strong></div><div class="ending-lines"><p><b>美桜</b>「あーっ、あと${yen(GOAL-state.money)}！ どこかで仕事の選び方を変えれば……！」</p></div><p>1日目の実績はそのまま。<br>2日目の朝から再挑戦できます。</p><div class="actions">${btn('retry','2日目の朝から再挑戦')}${btn('reset','最初から',false)}</div></section>`;
  const lines=[['ナレーション','3日間のなんでも屋、無事に営業終了！'],['美桜','よし、旅行資金5万円、達成！'],['ナレーション','小さな依頼も大きな依頼も、ひとつずつ積み重なって旅の切符になった。'],['美桜','じゃあ、行ってきます！']];
  if(state.outcomeByJob.D1_TURTLE===true) lines.push(['おばあちゃん','亀吉もお見送りよ！'],['美桜','……亀吉、ちゃんと起きてる？(笑)']);
  else if(state.outcomeByJob.D2_TASTE===true) lines.push(['菓子店主','旅のおやつに新作タルトをどうぞ！'],['美桜','これは帰りの楽しみにしようかな']);
  else lines.push(['依頼人たち','いってらっしゃい！'],['美桜','みんな、ありがとう！']);
  return `<section class="center-paper"><div class="eyebrow">THE NEXT PAGE IS YOUR TRIP.</div><div class="goal-stamp">MISSION CLEAR!</div><h2 class="focus-title" tabindex="-1">旅行へ出発！</h2><div class="ticket"><small>YOUR TICKET TO A LITTLE ADVENTURE</small><strong>${yen(state.money)}</strong><p>3日間で集めた、大切な旅行資金</p></div><div class="ending-lines">${lines.map(l=>`<p><b>${escapeHTML(l[0])}</b>「${escapeHTML(l[1])}」</p>`).join('')}</div><div class="actions">${btn('reset','もう一度はじめる',false)}</div></section>`;
}
function render(focus=true) {
  document.getElementById('reset').hidden=!started;
  document.getElementById('edition').hidden=started;
  document.getElementById('save-status').textContent=started?(saveAvailable?'進行状況は、このブラウザに自動保存されます。':'自動保存は利用できません。この画面を閉じずに遊んでください。'):'選択肢で進む、小さな旅じたく。';
  app.innerHTML=started?dashboard()+(['intro','choice','result','reward'].includes(state.phase)?storyView():state.phase==='list'?listView():state.phase==='dayend'?dayendView():state.phase==='bonus'?bonusView():endingView()):titleView();
  if(focus){app.querySelector('.focus-title')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
}
function start() {state=freshState();started=true;resumeCandidate=null;save();render();}
app.addEventListener('click',event=>{
  const button=event.target.closest('button[data-action]');if(!button)return;
  const action=button.dataset.action;
  if(action==='start'){start();return;}
  if(action==='continue'&&resumeCandidate){state=clone(resumeCandidate);started=true;render();return;}
  if(action==='reset'||action==='start-over'){modal.showModal();return;}
  if(!started)return;
  const next=transition(state,action,action==='choose'?Number(button.dataset.value):button.dataset.value);
  if(next===state)return;
  state=next;save();render();
});
document.getElementById('reset').addEventListener('click',()=>modal.showModal());
document.getElementById('cancel-reset').addEventListener('click',()=>modal.close());
document.getElementById('confirm-reset').addEventListener('click',()=>{modal.close();start();});
render(false);

</script>
</body>
</html>
